# Invariants: rules the build must keep, independent of how it is built.
#
# Fields
#   decisions[]   id (ADR id), title, status (Proposed | Accepted | Not written), as_of
#   invariants[]  id, adr, standing (normative only when its ADR is Accepted;
#                 otherwise candidate: reported, never held to `expected`),
#                 rule (no module or function names), expected
#                 (ENFORCED | PARTIAL | MISSING), probes[]
#   probes[]      id, what, kind (static | unit | runtime), target (today's
#                 implementation; only here), must_not_regress (an existing
#                 hard control: fails CI whatever the rule's standing)
schema: 1

decisions: []
#  - id: ADR-001
#    title: Example
#    status: Proposed
#    as_of: YYYY-MM-DD

invariants: []
